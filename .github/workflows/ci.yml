name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compute-plane:
    name: Compute plane (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compute-plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: compute-plane/go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

  control-plane:
    name: Control plane (Nest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: control-plane/package-lock.json
      - name: Install
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Build
        run: npm run build

  console:
    name: Console (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build

  smoke:
    name: Compose smoke
    runs-on: ubuntu-latest
    needs: [compute-plane, control-plane, console]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y jq zip
      - name: Shared work directory
        run: mkdir -p /tmp/nimbus-work && chmod 1777 /tmp/nimbus-work
      - name: make up
        run: make up
      - name: make hello
        run: make hello
      - name: make smoke
        run: make smoke
      - name: make config-check
        run: make config-check
      - name: make warm-check
        run: make warm-check
      - name: make async-check
        run: make async-check
      # make obs-check baja Prometheus, Grafana, Jaeger y el collector.
      # No corre en CI: el job de compose se queda con el stack del MVP.
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt || true
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose-logs.txt
          if-no-files-found: ignore
