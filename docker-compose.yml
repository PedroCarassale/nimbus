# Nimbus Functions — Docker Compose
# Slice 2: MinIO para almacenamiento de artifacts
# Slice 3: Postgres para metadata + NestJS control plane
# Slice 4: Redis para concurrencia + Go compute plane
#
# Uso: docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: nimbus-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nimbus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nimbus}
      POSTGRES_DB: ${POSTGRES_DB:-nimbus}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nimbus} -d ${POSTGRES_DB:-nimbus}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: nimbus-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Silo es un fork S3 compatible con MinIO. Las imágenes minio/minio y
  # minio/mc ya no se pueden bajar sin cuenta (Docker Hub y quay.io).
  minio:
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z@sha256:7bb2aff6b89efe1cb1303c10fc21d579447434ed06649ac9ec05a5e2dbf30ad7
    container_name: nimbus-minio
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Consola web
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio-init:
    image: pgsty/mc:latest@sha256:b532278b7a3747dbab6fe45eebb40a653efa704e6758e24e9d9ec54fc96c1800
    container_name: nimbus-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-nimbus-artifacts}
    entrypoint: >
      /bin/sh -c "
        i=0;
        until mc alias set nimbus http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do
          i=$$((i+1));
          if [ $$i -ge 30 ]; then
            echo 'No se pudo configurar el alias de Silo/MinIO';
            exit 1;
          fi;
          sleep 1;
        done;
        mc mb nimbus/$${MINIO_BUCKET} --ignore-existing;
        mc anonymous set download nimbus/$${MINIO_BUCKET};
        echo Bucket $${MINIO_BUCKET} listo;
      "

  compute-plane:
    build:
      context: ./compute-plane
      dockerfile: Dockerfile
    container_name: nimbus-compute-plane
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      REDIS_URL: redis:6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-nimbus-artifacts}
      NIMBUS_IMAGE: nimbus-node
      # Mismo path en el contenedor y en el host: el daemon resuelve -v.
      NIMBUS_WORK_DIR: /tmp/nimbus-work
      NIMBUS_TIMEOUT_SEC: ${NIMBUS_TIMEOUT_SEC:-5}
      NIMBUS_MEMORY_MB: ${NIMBUS_MEMORY_MB:-128}
      NIMBUS_HANDLER: ${NIMBUS_HANDLER:-handler}
      NIMBUS_CPUS: ${NIMBUS_CPUS:-}
      NIMBUS_FN_CONCURRENCY: ${NIMBUS_FN_CONCURRENCY:-2}
      NIMBUS_FN_QUEUE_MAX: ${NIMBUS_FN_QUEUE_MAX:-32}
      NIMBUS_FN_QUEUE_WAIT_SEC: ${NIMBUS_FN_QUEUE_WAIT_SEC:-30}
      NIMBUS_MAX_CONTAINERS: ${NIMBUS_MAX_CONTAINERS:-8}
      NIMBUS_SLOT_LEASE_SEC: ${NIMBUS_SLOT_LEASE_SEC:-30}
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Bind mount con el mismo path adentro y afuera. Un volume con nombre
      # no sirve: el daemon vería otra ruta al hacer docker run -v.
      - /tmp/nimbus-work:/tmp/nimbus-work
      - ./runtime-node:/app/runtime-node:ro
    healthcheck:
      # wget --spider manda HEAD y chi no enruta HEAD en GET. Hay que hacer GET.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  control-plane:
    build:
      context: ./control-plane
      dockerfile: Dockerfile
    container_name: nimbus-control-plane
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nimbus}:${POSTGRES_PASSWORD:-nimbus}@postgres:5432/${POSTGRES_DB:-nimbus}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-nimbus-artifacts}
      COMPUTE_PLANE_URL: http://compute-plane:8080
      REDIS_URL: redis:6379
      NIMBUS_TIMEOUT_SEC: ${NIMBUS_TIMEOUT_SEC:-5}
      NIMBUS_MEMORY: ${NIMBUS_MEMORY:-128m}
      NIMBUS_HANDLER: ${NIMBUS_HANDLER:-handler}
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      compute-plane:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 40s

  console:
    build:
      context: ./console
      dockerfile: Dockerfile
    container_name: nimbus-console
    ports:
      - "8088:80"
    depends_on:
      control-plane:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
    name: nimbus-postgres-data
  minio-data:
    name: nimbus-minio-data
  redis-data:
    name: nimbus-redis-data
