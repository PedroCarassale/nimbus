# Nimbus Functions — Docker Compose
# Artifacts: LocalStack (API de S3). Vaciar S3_ENDPOINT apunta el mismo código a AWS.
# Cola async: SQS + DLQ nativa en LocalStack. NIMBUS_ASYNC_BACKEND=redis vuelve al stream.
# Slice 3: Postgres para metadata + NestJS control plane
# Slice 4: Redis para concurrencia, locks y resultados async
#
# Uso: docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: nimbus-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nimbus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nimbus}
      POSTGRES_DB: ${POSTGRES_DB:-nimbus}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nimbus} -d ${POSTGRES_DB:-nimbus}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: nimbus-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # LocalStack emula S3 y SQS. 4.14.0 es el último release community:
  # desde 2026.03.0 la imagen unificada sale con código 55 si no hay
  # LOCALSTACK_AUTH_TOKEN, también para S3 y SQS. El digest fija el binario.
  # path + HOSTNAME_EXTERNAL dejan las URLs en
  # http://localstack:4566/000000000000/<nombre>.
  localstack:
    image: localstack/localstack:4.14.0@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a
    container_name: nimbus-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,sqs
      AWS_DEFAULT_REGION: us-east-1
      SQS_ENDPOINT_STRATEGY: path
      HOSTNAME_EXTERNAL: localstack
      LOCALSTACK_HOST: localstack
      DEBUG: "0"
    volumes:
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  localstack-init:
    image: localstack/localstack:4.14.0@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a
    container_name: nimbus-localstack-init
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      S3_BUCKET: ${S3_BUCKET:-nimbus-artifacts}
      SQS_QUEUE_NAME: nimbus-async-jobs
      SQS_DLQ_NAME: nimbus-async-dlq
      NIMBUS_ASYNC_MAX_ATTEMPTS: ${NIMBUS_ASYNC_MAX_ATTEMPTS:-3}
    volumes:
      - ./scripts/localstack-init.sh:/init/localstack-init.sh:ro
    entrypoint: ["/bin/bash", "/init/localstack-init.sh"]

  compute-plane:
    build:
      context: ./compute-plane
      dockerfile: Dockerfile
    container_name: nimbus-compute-plane
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      REDIS_URL: redis:6379
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      S3_BUCKET: ${S3_BUCKET:-nimbus-artifacts}
      S3_ENDPOINT: http://localstack:4566
      S3_FORCE_PATH_STYLE: "true"
      SQS_ENDPOINT: http://localstack:4566
      SQS_QUEUE_URL: http://localstack:4566/queue/us-east-1/000000000000/nimbus-async-jobs
      SQS_DLQ_URL: http://localstack:4566/queue/us-east-1/000000000000/nimbus-async-dlq
      NIMBUS_ASYNC_BACKEND: sqs
      NIMBUS_IMAGE: nimbus-node
      # Mismo path en el contenedor y en el host: el daemon resuelve -v.
      NIMBUS_WORK_DIR: /tmp/nimbus-work
      NIMBUS_TIMEOUT_SEC: ${NIMBUS_TIMEOUT_SEC:-5}
      NIMBUS_MEMORY_MB: ${NIMBUS_MEMORY_MB:-128}
      NIMBUS_HANDLER: ${NIMBUS_HANDLER:-handler}
      NIMBUS_CPUS: ${NIMBUS_CPUS:-}
      NIMBUS_FN_CONCURRENCY: ${NIMBUS_FN_CONCURRENCY:-2}
      NIMBUS_FN_QUEUE_MAX: ${NIMBUS_FN_QUEUE_MAX:-32}
      NIMBUS_FN_QUEUE_WAIT_SEC: ${NIMBUS_FN_QUEUE_WAIT_SEC:-30}
      NIMBUS_MAX_CONTAINERS: ${NIMBUS_MAX_CONTAINERS:-8}
      NIMBUS_SLOT_LEASE_SEC: ${NIMBUS_SLOT_LEASE_SEC:-30}
      NIMBUS_WARM: ${NIMBUS_WARM:-1}
      NIMBUS_WARM_IDLE_SEC: ${NIMBUS_WARM_IDLE_SEC:-60}
      NIMBUS_ASYNC_ENABLED: ${NIMBUS_ASYNC_ENABLED:-1}
      NIMBUS_ASYNC_MAX_ATTEMPTS: ${NIMBUS_ASYNC_MAX_ATTEMPTS:-3}
      NIMBUS_ASYNC_BACKOFF_BASE_MS: ${NIMBUS_ASYNC_BACKOFF_BASE_MS:-500}
      NIMBUS_ASYNC_BACKOFF_MAX_MS: ${NIMBUS_ASYNC_BACKOFF_MAX_MS:-30000}
      NIMBUS_ASYNC_BACKOFF_JITTER_MS: ${NIMBUS_ASYNC_BACKOFF_JITTER_MS:-250}
      NIMBUS_ASYNC_CLAIM_IDLE_MS: ${NIMBUS_ASYNC_CLAIM_IDLE_MS:-20000}
      NIMBUS_ASYNC_LOCK_MS: ${NIMBUS_ASYNC_LOCK_MS:-15000}
      NIMBUS_ASYNC_WORKERS: ${NIMBUS_ASYNC_WORKERS:-4}
      # Tracing is on by default and exports in the background. make up does
      # not start the collector; a down collector must not fail invocations.
      NIMBUS_TRACING: ${NIMBUS_TRACING:-1}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_SERVICE_NAME: nimbus-compute-plane
    depends_on:
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
      localstack-init:
        condition: service_completed_successfully
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Bind mount con el mismo path adentro y afuera. Un volume con nombre
      # no sirve: el daemon vería otra ruta al hacer docker run -v.
      - /tmp/nimbus-work:/tmp/nimbus-work
      - ./runtime-node:/app/runtime-node:ro
    healthcheck:
      # wget --spider manda HEAD y chi no enruta HEAD en GET. Hay que hacer GET.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  control-plane:
    build:
      context: ./control-plane
      dockerfile: Dockerfile
    container_name: nimbus-control-plane
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nimbus}:${POSTGRES_PASSWORD:-nimbus}@postgres:5432/${POSTGRES_DB:-nimbus}
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      S3_BUCKET: ${S3_BUCKET:-nimbus-artifacts}
      S3_ENDPOINT: http://localstack:4566
      S3_FORCE_PATH_STYLE: "true"
      COMPUTE_PLANE_URL: http://compute-plane:8080
      REDIS_URL: redis:6379
      NIMBUS_TIMEOUT_SEC: ${NIMBUS_TIMEOUT_SEC:-5}
      NIMBUS_MEMORY: ${NIMBUS_MEMORY:-128m}
      NIMBUS_HANDLER: ${NIMBUS_HANDLER:-handler}
      NIMBUS_TRACING: ${NIMBUS_TRACING:-1}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_SERVICE_NAME: nimbus-control-plane
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
      localstack-init:
        condition: service_completed_successfully
      compute-plane:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 40s

  console:
    build:
      context: ./console
      dockerfile: Dockerfile
    container_name: nimbus-console
    ports:
      - "8088:80"
    depends_on:
      control-plane:
        condition: service_healthy
    healthcheck:
      # wget resuelve localhost a ::1 y nginx escucha en IPv4. 127.0.0.1 evita
      # un healthcheck que falla para siempre con "connection refused".
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Observabilidad (Paso 5). No entra en `make up`: `make obs` o `make obs-check`.
  otel-collector:
    image: otel/opentelemetry-collector:0.114.0
    container_name: nimbus-otel-collector
    profiles: ["obs"]
    command: ["--config=/etc/otel/collector.yaml"]
    volumes:
      - ./observability/otel/collector.yaml:/etc/otel/collector.yaml:ro
    ports:
      - "4318:4318"
    depends_on:
      - jaeger
    mem_limit: 128m

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: nimbus-jaeger
    profiles: ["obs"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    mem_limit: 384m

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: nimbus-prometheus
    profiles: ["obs"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=24h"
      - "--web.enable-lifecycle"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    mem_limit: 256m

  grafana:
    image: grafana/grafana:11.4.0
    container_name: nimbus-grafana
    profiles: ["obs"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_USERS_DEFAULT_THEME: dark
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    mem_limit: 256m

volumes:
  postgres-data:
    name: nimbus-postgres-data
  localstack-data:
    name: nimbus-localstack-data
  redis-data:
    name: nimbus-redis-data
