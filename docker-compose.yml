# Nimbus Functions — Docker Compose
# Slice 2: MinIO para almacenamiento de artifacts
#
# Uso: docker compose up -d

services:
  minio:
    image: minio/minio:latest
    container_name: nimbus-minio
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Consola web
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio-init:
    image: minio/mc:latest
    container_name: nimbus-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-nimbus-artifacts}
    entrypoint: >
      /bin/sh -c "
        mc alias set nimbus http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
        mc mb nimbus/$${MINIO_BUCKET} --ignore-existing;
        mc anonymous set download nimbus/$${MINIO_BUCKET};
        echo 'Bucket $${MINIO_BUCKET} listo';
      "

volumes:
  minio-data:
    name: nimbus-minio-data
